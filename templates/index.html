<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Normalizer</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #6ee7b7;
    --text: #e6e8eb;
    --muted: #9aa0aa;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .container {
    max-width: 640px;
    width: 100%;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 28px;
  }
  code {
    background: #262a33;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 24px;
  }

  .dropzone:hover {
    border-color: var(--accent);
  }
  input[type="file"] {
    display: none;
  }
  #file-label {
    color: var(--muted);
    font-size: 0.95rem;
  }
  #file-name {
    color: var(--accent);
    font-weight: 600;
    margin-top: 8px;
    display: none;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0f1115;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover {
    opacity: 0.9;
  }
  .error {
    background: #3a1e22;
    border: 1px solid #6b2b33;
    color: #f3a9b0;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .result img {
    width: 100%;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  a.download-btn {
    display: block;
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    background: var(--accent);
    color: #0f1115;
    font-weight: 700;
    text-decoration: none;
  }
  .formula {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: -12px;
    margin-bottom: 24px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Pixel Normalizer</h1>
  <p class="subtitle">Upload a raster image and rescale every pixel with <code>(X - Xmin) / (Xmax - Xmin)</code></p>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  <div class="card">
    <form method="POST" enctype="multipart/form-data" id="upload-form">
      <label class="dropzone" for="image-input">
        <div id="file-label">Click to choose an image (PNG, JPG, BMP, TIFF, GIF)</div>
        <div id="file-name"></div>
      </label>
      <input type="file" name="image" id="image-input" accept="image/*" required>
      <button type="submit">Normalize Image</button>
    </form>
  </div>

  {% if result_image %}
  <div class="card result">
    <h2 style="margin-top:0;">Result</h2>
    <img src="{{ result_image }}" alt="Normalized image">
    <a class="download-btn" href="{{ result_image }}" download="normalized.png">Download Normalized Image</a>
  </div>
  {% endif %}
</div>

<script>
  const input = document.getElementById('image-input');
  const label = document.getElementById('file-label');
  const nameDisplay = document.getElementById('file-name');
  input.addEventListener('change', () => {
    if (input.files.length > 0) {
      label.style.display = 'none';
      nameDisplay.style.display = 'block';
      nameDisplay.textContent = input.files[0].name;
    }
  });
</script>
</body>
</html>
